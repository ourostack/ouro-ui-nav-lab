# Builds the nav lab from ourostack/ouro-ui's mockup branch and publishes it here, so the mockups load on a phone.
# It never touches ui.ouroboros.bot. Then it screenshots each mockup and runs Ouro check on it, as artifacts.
name: Preview
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The ouro-ui branch or commit to build.
        default: arimendelow-nav-redesign-mockups
      mode:
        description: "full: build, publish and check. panels: only photograph and check the panels already published."
        default: full
        type: choice
        options: [full, panels, before]
      before_ref:
        description: "before: the ouro-ui commit to build and check locally, for before-and-after photographs."
        default: ""
      prefix:
        description: The name the panel photographs start with.
        default: after
permissions:
  contents: read
concurrency:
  group: preview-${{ inputs.mode }}
  cancel-in-progress: true
env:
  BASE: /ouro-ui-nav-lab/
  URL: https://ourostack.github.io/ouro-ui-nav-lab/
jobs:
  build:
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourostack/ouro-ui
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The fonts and logo the lab shows
        run: |
          mkdir -p site/nav-lab/public/fonts site/nav-lab/public/brand
          cp site/public/fonts/*.woff2 site/nav-lab/public/fonts/
          cp site/public/brand/ouro-hx-render*.webp site/nav-lab/public/brand/
      - run: NAV_LAB_BASE=$BASE pnpm exec vite build --config site/nav-lab/vite.config.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/nav-lab
  deploy:
    if: inputs.mode == 'full'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ env.URL }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  shots:
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || inputs.mode == 'panels')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourostack/ouro-ui
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Pages to serve this build
        run: |
          # Until the page and the script it names both answer, so no check runs against a half-swapped deploy.
          for i in $(seq 1 30); do
            js=$(curl -fsS "$URL?nocache=$i" | grep -o 'assets/index-[^"]*\.js' | head -1)
            [ -n "$js" ] && curl -fsS -o /dev/null "$URL$js" && sleep 20 && break
            sleep 10
          done
      - name: Panels at every size from 320px to 4K (space, wraps, blurbs, off the screen)
        continue-on-error: true
        run: node site/nav-lab/panels.mjs "$URL" .tmp/nav-panels "${{ inputs.prefix }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compass morphs between panels (never unmounts, sizes in between; none with reduced motion), and a recording
        if: inputs.mode == 'full'
        continue-on-error: true
        run: |
          node site/nav-lab/morph.mjs "$URL" .tmp/nav-morph | tee -a "$GITHUB_STEP_SUMMARY"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          ffmpeg -loglevel error -y -i .tmp/nav-morph/morph.webm -movflags +faststart -pix_fmt yuv420p -vf "scale=1280:-2" .tmp/nav-morph/morph.mp4
          ffmpeg -loglevel error -y -i .tmp/nav-morph/morph.webm -vf "fps=12,scale=900:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" .tmp/nav-morph/morph.gif
      - name: Disclosure behaviour (click, Escape, focus, hover timings, touch targets)
        if: inputs.mode == 'full'
        continue-on-error: true
        run: node site/nav-lab/behaviour.mjs "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Screenshots
        if: inputs.mode == 'full'
        run: node site/nav-lab/shots.mjs "$URL" .tmp/nav-shots
      - name: Ouro check, closed and open, phone, laptop and 4K, light and dark
        if: inputs.mode == 'full'
        continue-on-error: true
        run: |
          targets=""
          for m in a b c d e; do targets="$targets ${URL}?m=$m#/apple/ax/ ${URL}?m=$m&open=1#/apple/ax/"; done
          node registry/ouro/check/check.ts $targets --sizes 390x844,1440x900,3840x2160 --themes light,dark --out .tmp/nav-check --no-measured 2>&1 | tail -60
          cat .tmp/nav-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nav-lab-evidence
          path: |
            .tmp/nav-shots
            .tmp/nav-check
            .tmp/nav-panels
            .tmp/nav-morph
  before:
    # Builds an earlier commit and serves it on this runner, so its panels can be photographed and checked without
    # publishing it over the preview people are trying.
    if: inputs.mode == 'before'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourostack/ouro-ui
          ref: ${{ inputs.before_ref }}
          path: old
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourostack/ouro-ui
          ref: ${{ inputs.ref }}
          path: new
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: new/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the earlier commit
        working-directory: old
        run: |
          pnpm install --frozen-lockfile
          mkdir -p site/nav-lab/public/fonts site/nav-lab/public/brand
          cp site/public/fonts/*.woff2 site/nav-lab/public/fonts/
          cp site/public/brand/ouro-hx-render*.webp site/nav-lab/public/brand/
          NAV_LAB_BASE=$BASE pnpm exec vite build --config site/nav-lab/vite.config.ts
          mkdir -p /tmp/www && cp -r .tmp/nav-lab /tmp/www/ouro-ui-nav-lab
      - name: Photograph and check its panels
        working-directory: new
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          (cd /tmp/www && python3 -m http.server 4173 >/dev/null 2>&1 &)
          sleep 2
          node site/nav-lab/panels.mjs "http://localhost:4173/ouro-ui-nav-lab/" .tmp/nav-panels before | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nav-lab-before
          path: new/.tmp/nav-panels
